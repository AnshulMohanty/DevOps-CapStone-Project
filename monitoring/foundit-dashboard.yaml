# Grafana dashboard for FoundIt. Grafana mounts this ConfigMap as a file (dashboardsConfigMaps in
# prometheus-values.yaml), so apply it before installing kube-prometheus-stack:
#   kubectl create namespace monitoring; kubectl apply -f monitoring/foundit-dashboard.yaml
# Top rows: is the service healthy, how busy and how fast is it, how many pods.
# Bottom rows: what the app is actually doing (lost/found/returned items).
apiVersion: v1
kind: ConfigMap
metadata:
  name: foundit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  foundit.json: |
    {
      "uid": "foundit",
      "title": "FoundIt - service & business overview",
      "tags": [
        "foundit"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "row",
          "title": "Service health",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Backend targets UP",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(up{job=\"foundit-backend\"})",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Requests / s",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"foundit-backend\"}[1m]))",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            }
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "p95 latency",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"foundit-backend\"}[2m])))",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "5xx error ratio (5m)",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{job=\"foundit-backend\",status=\"5xx\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{job=\"foundit-backend\"}[5m])), 1e-9)",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Backend pods (HPA)",
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"foundit\",horizontalpodautoscaler=\"foundit-backend\"}",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "Backend CPU vs request",
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"foundit\",pod=~\"foundit-backend-.*\",container=\"backend\"}[2m])) / sum(kube_pod_container_resource_requests{namespace=\"foundit\",pod=~\"foundit-backend-.*\",container=\"backend\",resource=\"cpu\"})",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.6
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            }
          },
          "id": 7
        },
        {
          "type": "timeseries",
          "title": "Requests / s by endpoint",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (method, handler) (rate(http_requests_total{job=\"foundit-backend\"}[1m]))",
              "legendFormat": "{{method}} {{handler}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              },
              "unit": "reqps"
            }
          },
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"foundit-backend\"}[2m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"foundit-backend\"}[2m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"foundit-backend\"}[2m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              },
              "unit": "s"
            }
          },
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "HPA: current vs desired replicas",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"foundit\",horizontalpodautoscaler=\"foundit-backend\"}",
              "legendFormat": "current",
              "refId": "A"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"foundit\",horizontalpodautoscaler=\"foundit-backend\"}",
              "legendFormat": "desired",
              "refId": "B"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"foundit\",horizontalpodautoscaler=\"foundit-backend\"}",
              "legendFormat": "max",
              "refId": "C"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          },
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "Backend CPU per pod (cores)",
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"foundit\",pod=~\"foundit-backend-.*\",container=\"backend\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          },
          "id": 11
        },
        {
          "type": "row",
          "title": "FoundIt business metrics",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 12
        },
        {
          "type": "stat",
          "title": "Still lost (open)",
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(foundit_items_open{type=\"LOST\"})",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#e11d48",
                    "value": null
                  }
                ]
              }
            }
          },
          "id": 13
        },
        {
          "type": "stat",
          "title": "Found, waiting for owner",
          "gridPos": {
            "x": 6,
            "y": 23,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(foundit_items_open{type=\"FOUND\"})",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0d9488",
                    "value": null
                  }
                ]
              }
            }
          },
          "id": 14
        },
        {
          "type": "stat",
          "title": "Reports in the last hour",
          "gridPos": {
            "x": 12,
            "y": 23,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(foundit_items_reported_total[1h]))",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6366f1",
                    "value": null
                  }
                ]
              }
            }
          },
          "id": 15
        },
        {
          "type": "stat",
          "title": "Returned in the last hour",
          "gridPos": {
            "x": 18,
            "y": 23,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(foundit_items_resolved_total[1h]))",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#15803d",
                    "value": null
                  }
                ]
              }
            }
          },
          "id": 16
        },
        {
          "type": "timeseries",
          "title": "Items reported per minute, by type",
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (type) (rate(foundit_items_reported_total[5m])) * 60",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "short"
            }
          },
          "id": 17
        },
        {
          "type": "timeseries",
          "title": "Items returned per minute",
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(foundit_items_resolved_total[5m])) * 60",
              "legendFormat": "returned",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              },
              "unit": "short"
            }
          },
          "id": 18
        }
      ]
    }
