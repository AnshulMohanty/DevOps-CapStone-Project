name: foundit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foundit
      POSTGRES_USER: foundit
      POSTGRES_PASSWORD: foundit   # local development only - Kubernetes uses a Secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # "running" is not "ready": the backend runs Alembic on start and exits if Postgres
    # is still initialising, so it waits for this check instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundit -d foundit"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: foundit-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://foundit:foundit@postgres:5432/foundit
      APP_VERSION: 1.0.0-compose
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: foundit-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
