{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "foundit.fullname" . }}
  labels:
    {{- include "foundit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # Longest prefix wins: /api/... goes to the backend, everything else to the UI.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "foundit.backend" . }}
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "foundit.frontend" . }}
                port: {name: http}
      {{- /* No host = match every hostname (the EKS load balancer has a generated one). */}}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
