{{- $component := dict "ctx" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foundit.backend" . }}
  labels:
    {{- include "foundit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- /* With the HPA on, the HPA owns the replica count - setting it here would reset it on every sync. */}}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never drop below the current capacity
  selector:
    matchLabels:
      {{- include "foundit.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foundit.selectorLabels" $component | nindent 8 }}
      annotations:
        # A changed database password changes this hash, which rolls the pods to pick it up.
        checksum/db-secret: {{ include (print $.Template.BasePath "/postgres.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      # Spread the replicas over nodes when there is more than one (EKS), so one node loss is not an outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "foundit.selectorLabels" $component | nindent 14 }}
      initContainers:
        # The app runs "alembic upgrade head" first and exits if PostgreSQL is not accepting
        # connections yet. Waiting here avoids a CrashLoopBackOff on the first install.
        # -U is required: uid 10001 has no user name, and without one pg_isready answers "no attempt".
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "foundit.postgres" . }} -p 5432 -U {{ .Values.postgres.username }}; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            {{- include "foundit.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: backend
          image: {{ include "foundit.image" (dict "ctx" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: APP_VERSION
              value: {{ .Values.backend.appVersion | default .Chart.AppVersion | quote }}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ include "foundit.postgres" . }}, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "foundit.postgres" . }}, key: password}}
            # $(VAR) is expanded by Kubernetes from the variables defined above.
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ include "foundit.postgres" . }}:5432/{{ .Values.postgres.database }}"
          # Alembic runs before uvicorn listens, so give the first start time before liveness counts.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "foundit.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foundit.backend" . }}
  labels:
    {{- include "foundit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "foundit.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http          # the ServiceMonitor scrapes this port by name
      port: 8000
      targetPort: http
